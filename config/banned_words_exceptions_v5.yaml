    path: ^docs/requirements/REQ\-ENTERPRISE\-AUTH\.md$
    rationale: 'Keycloak realm / APISIX openid-connect ''realm'' field / WWW-Authenticate challenge: platform
      literal.'
    owner: workspace-ci
    review_date: '2026-09-11'
    removal: Remove when the quote ends.
