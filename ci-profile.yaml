version: 1
project: workspace-gateway
tier: strict
languages: [lua, shell]
hooks:
  pre-commit:
    - check-unstaged
    - block-sensitive-files
    - gitleaks
    - ci-check-error-swallow
    - check-banned-words
    - check-portable-shell
    - check-markdown-docs
    - check-file-length
    - check-required-hooks-present
    - check-dependency-versions
    - ci-lint
    - ci-type-check
  commit-msg:
    - check-commit-message
    - block-coauthored
  pre-push:
    - block-coauthored-history
    - ci-check-push
    - check-dead-code

overrides:
  - check-markdown-docs:
    entry: "uv run --project /opt/workspace-ci --no-sync python -m ci.check_markdown_docs --all-md --check-remote"
  - check-dependency-versions:
    entry: 'uv run --project /opt/workspace-ci --no-sync python -m ci.check_dependency_versions validate --consumer-root "$PWD" --exclusions config/dependency_excludes.yaml --catalog-if-present res/dependency-pins.yaml --compose res/docker/docker-compose.yml'
