---
# WORKSPACE-GATEWAY - Compose stack systemd provisioning
#
# Tags: deploy, start, stop, restart, status, undeploy
# Makefile targets call these tags; health checks run from dev.yml
# directly (no nested ansible-inception).
- name: WORKSPACE-GATEWAY Compose Stack
  hosts: localhost
  gather_facts: true

  vars:
    project_root: '{{ playbook_dir | dirname | dirname }}'
    compose_file: '{{ project_root }}/res/docker/docker-compose.yml'
    gateway_unit: gateway-compose.service
    systemd_dir: '{{ ansible_env.HOME }}/.config/systemd/user'
    venv_compose: '{{ project_root }}/.venv/bin/podman-compose'
    ci_podman: /opt/workspace-ci/.boot-linux/bin/podman

  tasks:
    - name: Resolve project root
      tags: [always]
      block:
        - name: Get absolute project path
          ansible.builtin.command: realpath {{ project_root }}
          register: resolved_root
          changed_when: false

        - name: Set resolved paths
          ansible.builtin.set_fact:
            project_root: '{{ resolved_root.stdout }}'
            compose_file: '{{ resolved_root.stdout }}/res/docker/docker-compose.yml'
            venv_compose: '{{ resolved_root.stdout }}/.venv/bin/podman-compose'

    - name: Detect container runtime
      tags: [always]
      block:
        - name: Check deployed CI podman
          ansible.builtin.stat:
            path: '{{ ci_podman }}'
          register: podman_stat
          changed_when: false

        - name: Find podman
          ansible.builtin.command: realpath {{ ci_podman }}
          register: podman_check
          changed_when: false
          failed_when: not podman_stat.stat.exists

        - name: Fail if podman missing
          ansible.builtin.fail:
            msg: 'podman not on PATH'
          when: podman_check.rc != 0

        - name: Check venv podman-compose
          ansible.builtin.stat:
            path: '{{ venv_compose }}'
          register: compose_stat

        - name: Fail if podman-compose missing
          ansible.builtin.fail:
            msg: 'Run make install in WORKSPACE-GATEWAY first (missing {{ venv_compose }})'
          when: not compose_stat.stat.exists

        - name: Resolve canonical podman wrapper path
          ansible.builtin.command: readlink -f {{ podman_check.stdout }}
          register: canonical_podman
          changed_when: false

        - name: Set runtime facts
          ansible.builtin.set_fact:
            podman_path: '{{ canonical_podman.stdout }}'
            podman_bin_dir: '{{ canonical_podman.stdout | dirname }}'
            compose_cmd: '{{ venv_compose }}'

    - name: Ensure external dataops network exists before Compose start
      tags: [deploy, start, restart]
      ansible.builtin.command: '{{ podman_path }} network create dataops_default'
      register: dataops_network
      changed_when: dataops_network.rc == 0
      failed_when: dataops_network.rc != 0 and 'already exists' not in (dataops_network.stderr | default(''))

    - name: Deploy gateway systemd unit (one-time provisioning)
      tags: [deploy]
      block:
        - name: Ensure systemd user directory exists
          ansible.builtin.file:
            path: '{{ systemd_dir }}'
            state: directory
            mode: '0755'

        - name: Enable systemd user linger
          ansible.builtin.command: loginctl enable-linger {{ ansible_user_id }}
          register: linger_result
          changed_when: linger_result.rc == 0
          failed_when: linger_result.rc != 0

        - name: Install gateway systemd unit
          ansible.builtin.template:
            src: templates/gateway-compose.service.j2
            dest: '{{ systemd_dir }}/{{ gateway_unit }}'
            mode: '0644'
          register: gateway_unit_template

        - name: Reload systemd user daemon
          ansible.builtin.systemd:
            daemon_reload: true
            scope: user

        - name: Enable and start gateway compose
          ansible.builtin.systemd:
            name: '{{ gateway_unit }}'
            enabled: true
            state: '{{ "restarted" if gateway_unit_template.changed else "started" }}'
            scope: user

    - name: Check gateway systemd unit state before start
      tags: [start]
      ansible.builtin.command: systemctl --user is-active {{ gateway_unit }}
      register: gateway_active
      changed_when: false
      failed_when: false

    - name: Refresh gateway systemd unit
      tags: [start, restart]
      ansible.builtin.template:
        src: templates/gateway-compose.service.j2
        dest: '{{ systemd_dir }}/{{ gateway_unit }}'
        mode: '0644'
      register: gateway_unit_refresh

    - name: Reload systemd after gateway unit refresh
      tags: [start, restart]
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      when: gateway_unit_refresh.changed

    - name: Check OpenBao host endpoint before start
      tags: [start]
      ansible.builtin.uri:
        url: http://127.0.0.1:8201/v1/sys/health
        method: GET
        status_code: [200, 429, 501, 503]
        timeout: 3
      register: gateway_host_health
      changed_when: false
      failed_when: false

    - name: Start gateway compose when inactive
      tags: [start]
      ansible.builtin.systemd:
        name: '{{ gateway_unit }}'
        state: started
        scope: user
      when: gateway_active.rc != 0

    - name: Recreate gateway compose when host port forwarding is stale
      tags: [start]
      ansible.builtin.systemd:
        name: '{{ gateway_unit }}'
        state: restarted
        scope: user
        enabled: true
      when:
        - gateway_active.rc == 0
        - gateway_host_health.status | default(0) not in [200, 429, 501, 503]

    - name: Restart gateway compose
      tags: [restart]
      ansible.builtin.systemd:
        name: '{{ gateway_unit }}'
        state: restarted
        scope: user
        enabled: true

    - name: Stop gateway compose
      tags: [stop, undeploy]
      ansible.builtin.systemd:
        name: '{{ gateway_unit }}'
        state: stopped
        scope: user
      register: stop_gateway
      failed_when: >
        stop_gateway.failed
        and 'Could not find the requested service' not in (stop_gateway.msg | default(''))

    - name: Show gateway status
      tags: [status, never]
      block:
        - name: Check gateway service
          ansible.builtin.command: systemctl --user is-active {{ gateway_unit }}
          register: gateway_status
          failed_when: gateway_status.rc not in [0, 3]
          changed_when: false

        - name: List gateway containers
          ansible.builtin.command:
            argv:
              - '{{ podman_path }}'
              - ps
              - --filter
              - label=io.podman.compose.project=docker
              - --format
              - 'table {{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Status{{ "}}" }}\t{{ "{{" }}.Ports{{ "}}" }}'
          register: gateway_containers
          changed_when: false

        - name: Display status
          ansible.builtin.debug:
            msg: |
              Gateway status:
                Unit       : {{ gateway_status.stdout | default('not installed') }}
                Containers :
              {{ gateway_containers.stdout | default('(none)') | indent(2, first=False) }}
                Logs       : journalctl --user -u {{ gateway_unit }} -f

    - name: Undeploy gateway compose
      tags: [undeploy, never]
      block:
        - name: Disable gateway service
          ansible.builtin.systemd:
            name: '{{ gateway_unit }}'
            enabled: false
            state: stopped
            scope: user
          register: undeploy_stop
          failed_when: >
            undeploy_stop.failed
            and 'Could not find the requested service' not in (undeploy_stop.msg | default(''))

        - name: Remove gateway unit file
          ansible.builtin.file:
            path: '{{ systemd_dir }}/{{ gateway_unit }}'
            state: absent

        - name: Reload systemd user daemon
          ansible.builtin.systemd:
            daemon_reload: true
            scope: user

        - name: Gateway undeployed
          ansible.builtin.debug:
            msg: Gateway compose undeployed.
