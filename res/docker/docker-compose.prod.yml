# Isolated production/staging stack (REQ/SPEC-GATEWAY-CORE FR-5).
#
# Differences from res/docker/docker-compose.yml (dev):
# - apisix runs the image built by `make gw-prod-build`
#   (localhost/workspace-gateway:0.1.0); plugin code comes from the image,
#   NOT from bind mounts, so the artifact under test is the real one.
# - separate project name (workspace-gateway-prod), container names,
#   volumes, networks (10.99.110+/24), and host ports (9081/9444).
# - no prometheus/grafana; observability stays on the dev stack.
# - OpenBao auto-init/unseal entrypoint provisions the fixed service token
#   from .env (OPENBAO_TOKEN), so both stacks share token configuration
#   while keeping isolated token-store state.
services:
  apisix:
    image: localhost/workspace-gateway:0.1.0
    container_name: gw-prod-apisix
    ports:
      - "9081:9080"
      - "9444:9443"
    volumes:
      - ../../conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../../conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../../conf/providers:/usr/local/apisix/conf/providers:ro
      - ../../conf/redact-patterns.json:/etc/apisix/redact-patterns.json:ro
      - ../../conf/profanity:/etc/apisix/profanity:ro
      - ../../res/scripts/usefulness:/usr/local/apisix/usefulness:ro
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      - vector
      - openbao
      - etcd
    stop_signal: SIGQUIT
    stop_grace_period: 300s
    restart: unless-stopped
    networks:
      gw-ch-prod:
        # Static address: stable Admin API target for host-side seeding
        # (seed-routes.sh) now that debug ports are unpublished.
        ipv4_address: 10.99.110.2
      gw-etcd-prod: {}
      gw-secrets-prod: {}
      gw-ingest-prod: {}

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    container_name: gw-prod-clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:8124:8123"
    volumes:
      - prod-clickhouse-data:/var/lib/clickhouse
      # 00- prefix: provision users/grants BEFORE init.sql baseline schema.
      - ../../res/docker/clickhouse-provision.sh:/docker-entrypoint-initdb.d/00-provision.sh:ro
      - ../../conf/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../../conf/clickhouse-disable-metric-logs.xml:/etc/clickhouse-server/config.d/disable-metric-logs.xml:ro
      - ../../conf/clickhouse-storage-tiering.xml:/etc/clickhouse-server/config.d/storage-tiering.xml:ro
      - ../../conf/clickhouse-users.d/ops-admin.xml:/etc/clickhouse-server/users.d/ops-admin.xml:ro
      - ../../conf/clickhouse-users.d/default-local.xml:/etc/clickhouse-server/users.d/zz-default-local.xml:ro
    environment:
      - CLICKHOUSE_PASSWORD
      - CH_OPS_PASSWORD
      - CH_GRAFANA_RO_PASSWORD
      - CH_VECTOR_PASSWORD
      - CH_APISIX_PASSWORD
      - CH_MIGRATOR_PASSWORD
      - CLICKHOUSE_DO_NOT_CHOWN=1
    restart: unless-stopped
    networks:
      gw-ch-prod:
        # Static: without this the DHCP pool leases 10.99.110.2 to
        # clickhouse before apisix claims it (IPAM conflict on recreate).
        ipv4_address: 10.99.110.3

  migrate:
    profiles: [migration]
    image: migrate/migrate@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    container_name: gw-prod-migrate
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ../../conf/migrations:/migrations:ro
    entrypoint:
      - "migrate"
      - "-path=/migrations/"
      - "-database=clickhouse://clickhouse:9000?username=migrator&password=${CH_MIGRATOR_PASSWORD}&database=llm_gateway&x-multi-statement=true&x-migrations-table-engine=MergeTree"
    command: ["up"]
    restart: "no"
    networks:
      gw-ch-prod: {}

  vector:
    image: timberio/vector@sha256:1163571c8b59ab6755c1b5488bb2f129151c3b72130ad0500b10420fcc504d9d
    container_name: gw-prod-vector
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ../../conf/vector.toml:/etc/vector/vector.toml:ro
    env_file:
      - ../../.env
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      gw-ch-prod: {}
      gw-ingest-prod: {}

  openbao:
    build:
      context: ../..
      dockerfile: res/docker/Dockerfile.openbao
    container_name: gw-prod-openbao
    volumes:
      - ../../conf/openbao.hcl:/openbao/config/openbao.hcl:ro
      - prod-openbao-data:/openbao/data
    env_file:
      - ../../.env
    environment:
      BAO_LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/v1/sys/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      gw-secrets-prod: {}

  etcd:
    image: quay.io/coreos/etcd@sha256:fb5f961035e5263b31fe103e57b645fa23e612c9d58118a8548eb160fedecb55
    container_name: gw-prod-etcd
    entrypoint: /usr/local/bin/etcd
    command:
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    env_file:
      - ../../.env
    healthcheck:
      # Authenticated once `make etcd-auth-init` has enabled RBAC; the
      # --user flag is ignored by an auth-disabled cluster, so this also
      # works before bootstrap.
      test: ["CMD-SHELL", "etcdctl --user root:\"$$ETCD_ROOT_PASSWORD\" endpoint health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - prod-etcd-data:/etcd-data
    restart: unless-stopped
    networks:
      gw-etcd-prod: {}

volumes:
  prod-clickhouse-data:
  prod-openbao-data:
  prod-etcd-data:

# Security segmentation (REQ-SECURITY-HARDENING FR-5), prod subnets at
# 10.99.110+/24 (dev stack lives at 10.99.10+/24).
networks:
  gw-ch-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.110.0/24
          gateway: 10.99.110.1
          # Keep the DHCP pool away from static allocations: apisix .2,
          # clickhouse .3. Without this, ephemeral containers (migrate)
          # lease .2 and block apisix recreation (IPAM error).
          ip_range: 10.99.110.64/26
  gw-etcd-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.120.0/24
          gateway: 10.99.120.1
  gw-secrets-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.130.0/24
          gateway: 10.99.130.1
  gw-ingest-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.140.0/24
          gateway: 10.99.140.1
