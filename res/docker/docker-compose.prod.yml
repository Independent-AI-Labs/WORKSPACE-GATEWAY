# Isolated production/staging stack (REQ/SPEC-GATEWAY-CORE FR-5).
#
# Differences from res/docker/docker-compose.yml (dev):
# - apisix runs the image built by `make gw-prod-build`
#   (localhost/workspace-gateway:0.1.0); plugin code comes from the image,
#   NOT from bind mounts, so the artifact under test is the real one.
# - separate project name (workspace-gateway-prod), container names,
#   volumes, network, and host ports (9081/9181/9101/...).
# - no prometheus/grafana; observability stays on the dev stack.
# - OpenBao auto-init/unseal entrypoint provisions the fixed service token
#   from .env (OPENBAO_TOKEN), so both stacks share token configuration
#   while keeping isolated token-store state.
services:
  apisix:
    image: localhost/workspace-gateway:0.1.0
    container_name: gw-prod-apisix
    ports:
      - "9081:9080"
      - "9444:9443"
      - "127.0.0.1:9181:9180"
      - "127.0.0.1:9101:9100"
    volumes:
      - ../../conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../../conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../../conf/providers:/usr/local/apisix/conf/providers:ro
      - ../../conf/redact-patterns.json:/etc/apisix/redact-patterns.json:ro
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      - vector
      - openbao
      - etcd
    stop_signal: SIGQUIT
    stop_grace_period: 300s
    restart: unless-stopped
    networks:
      - gateway-prod

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    container_name: gw-prod-clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9001:9000"
    volumes:
      - prod-clickhouse-data:/var/lib/clickhouse
      - ../../conf/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../../conf/clickhouse-disable-metric-logs.xml:/etc/clickhouse-server/config.d/disable-metric-logs.xml:ro
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_DO_NOT_CHOWN=1
    restart: unless-stopped
    networks:
      - gateway-prod

  migrate:
    profiles: [migration]
    image: migrate/migrate@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    container_name: gw-prod-migrate
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ../../conf/migrations:/migrations:ro
    entrypoint:
      - "migrate"
      - "-path=/migrations/"
      - "-database=clickhouse://clickhouse:9000/llm_gateway?database=llm_gateway&x-multi-statement=true&x-migrations-table-engine=MergeTree"
    command: ["up"]
    restart: "no"
    networks:
      - gateway-prod

  vector:
    image: timberio/vector@sha256:1163571c8b59ab6755c1b5488bb2f129151c3b72130ad0500b10420fcc504d9d
    container_name: gw-prod-vector
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ../../conf/vector.toml:/etc/vector/vector.toml:ro
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      - gateway-prod

  openbao:
    build:
      context: ../..
      dockerfile: res/docker/Dockerfile.openbao
    container_name: gw-prod-openbao
    volumes:
      - ../../conf/openbao.hcl:/openbao/config/openbao.hcl:ro
      - prod-openbao-data:/openbao/data
    env_file:
      - ../../.env
    environment:
      BAO_LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/v1/sys/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - gateway-prod

  etcd:
    image: quay.io/coreos/etcd@sha256:fb5f961035e5263b31fe103e57b645fa23e612c9d58118a8548eb160fedecb55
    container_name: gw-prod-etcd
    entrypoint: /usr/local/bin/etcd
    command:
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:2380:2379"
    volumes:
      - prod-etcd-data:/etcd-data
    restart: unless-stopped
    networks:
      - gateway-prod

volumes:
  prod-clickhouse-data:
  prod-openbao-data:
  prod-etcd-data:

networks:
  gateway-prod:
    driver: bridge
