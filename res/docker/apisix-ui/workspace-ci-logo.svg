<?xml version="1.0" encoding="UTF-8"?>
<!-- Vendored from WORKSPACE-CI web/public/LOGO_LIGHT_THEME.png (the
     workspaceguardrails.com mark). Wrapped as SVG with the PNG embedded so it
     can replace APISIX's content-hashed apisix-logo-*.svg asset without
     touching the Dashboard bundle's references. The square viewBox letterboxes
     the 216x156 mark so the Dashboard's 24x24 <img> does not distort it.
     Regenerate after a logo change: base64 -w0 LOGO_LIGHT_THEME.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216" width="216" height="216" aria-label="Workspace CI">
  <image x="0" y="30" width="216" height="156" href="data:image/png;base64,"/>
</svg>
