services:
  apisix:
    build:
      context: ../..
      dockerfile: res/docker/Dockerfile.apisix
    ports:
      - "9080:9080"
      - "9443:9443"
    volumes:
      - ../../conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../../conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../../conf/providers:/usr/local/apisix/conf/providers:ro
      - ../../conf/redact-patterns.json:/etc/apisix/redact-patterns.json:ro
      - ../../conf/profanity:/etc/apisix/profanity:ro
      - ../../conf/sql:/etc/apisix/sql:ro
      - ../../res/scripts/usefulness:/usr/local/apisix/usefulness:ro
      - ../../plugins/custom/key-resolver.lua:/usr/local/apisix/apisix/plugins/key-resolver.lua:ro
      - ../../plugins/custom/key-meta.lua:/usr/local/apisix/apisix/plugins/key-meta.lua:ro
      - ../../plugins/custom/oauth-auth.lua:/usr/local/apisix/apisix/plugins/oauth-auth.lua:ro
      - ../../plugins/custom/oauth_verify.lua:/usr/local/apisix/apisix/plugins/oauth_verify.lua:ro
      - ../../plugins/custom/oauth_broker.lua:/usr/local/apisix/apisix/plugins/oauth_broker.lua:ro
      - ../../plugins/custom/oauth_session.lua:/usr/local/apisix/apisix/plugins/oauth_session.lua:ro
      - ../../plugins/custom/oauth_jwt.lua:/usr/local/apisix/apisix/plugins/oauth_jwt.lua:ro
      - ../../plugins/custom/oauth_device.lua:/usr/local/apisix/apisix/plugins/oauth_device.lua:ro
      - ../../plugins/custom/oauth_store.lua:/usr/local/apisix/apisix/plugins/oauth_store.lua:ro
      - ../../plugins/custom/provider-sync.lua:/usr/local/apisix/apisix/plugins/provider-sync.lua:ro
      - ../../plugins/custom/provider_sync_catalog.lua:/usr/local/apisix/apisix/plugins/provider_sync_catalog.lua:ro
      - ../../plugins/custom/provider_sync_aliases.lua:/usr/local/apisix/apisix/plugins/provider_sync_aliases.lua:ro
      - ../../plugins/custom/provider_sync_contract.lua:/usr/local/apisix/apisix/plugins/provider_sync_contract.lua:ro
      - ../../plugins/custom/provider_sync_metadata.lua:/usr/local/apisix/apisix/plugins/provider_sync_metadata.lua:ro
      - ../../plugins/custom/sse-usage.lua:/usr/local/apisix/apisix/plugins/sse-usage.lua:ro
      - ../../plugins/custom/upstream_pool_lib.lua:/usr/local/apisix/apisix/plugins/upstream_pool_lib.lua:ro
      - ../../plugins/custom/sse_usage_lib.lua:/usr/local/apisix/apisix/plugins/sse_usage_lib.lua:ro
      - ../../plugins/custom/cost_calc.lua:/usr/local/apisix/apisix/plugins/cost_calc.lua:ro
      - ../../plugins/custom/model_registry.lua:/usr/local/apisix/apisix/plugins/model_registry.lua:ro
      - ../../plugins/custom/provider_sync_pricing.lua:/usr/local/apisix/apisix/plugins/provider_sync_pricing.lua:ro
      - ../../plugins/custom/provider_pricing.lua:/usr/local/apisix/apisix/plugins/provider_pricing.lua:ro
      - ../../plugins/custom/redact.lua:/usr/local/apisix/apisix/plugins/redact.lua:ro
      - ../../plugins/custom/redact_lib.lua:/usr/local/apisix/apisix/plugins/redact_lib.lua:ro
      - ../../plugins/custom/redact_walk.lua:/usr/local/apisix/apisix/plugins/redact_walk.lua:ro
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      - vector
      - openbao
      - etcd
    # Graceful shutdown: SIGQUIT makes nginx stop accepting and finish
    # in-flight requests (incl. long-lived SSE streams) before exiting.
    # SIGKILL only as last resort after the grace period.
    stop_signal: SIGQUIT
    stop_grace_period: 300s
    restart: unless-stopped
    networks:
      gw-ch:
        # Static address: stable Admin API target for host-side seeding
        # (seed-routes.sh) now that debug ports are unpublished.
        ipv4_address: 10.99.10.2
      gw-etcd: {}
      gw-secrets: {}
      gw-metrics: {}
      gw-ingest: {}
      dataops: {}

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # 00- prefix: provision users/grants BEFORE init.sql baseline schema.
      - ../../res/docker/clickhouse-provision.sh:/docker-entrypoint-initdb.d/00-provision.sh:ro
      - ../../conf/sql/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../../conf/clickhouse-disable-metric-logs.xml:/etc/clickhouse-server/config.d/disable-metric-logs.xml:ro
      - ../../conf/clickhouse-storage-tiering.xml:/etc/clickhouse-server/config.d/storage-tiering.xml:ro
      - ../../conf/clickhouse-performance.xml:/etc/clickhouse-server/config.d/performance.xml:ro
      - ../../conf/clickhouse-users.d/ops-admin.xml:/etc/clickhouse-server/users.d/ops-admin.xml:ro
      - ../../conf/clickhouse-users.d/default-local.xml:/etc/clickhouse-server/users.d/zz-default-local.xml:ro
      - ../../conf/clickhouse-users.d/performance.xml:/etc/clickhouse-server/users.d/zz-performance.xml:ro
    environment:
      - CLICKHOUSE_PASSWORD
      - CH_OPS_PASSWORD
      - CH_GRAFANA_RO_PASSWORD
      - CH_VECTOR_PASSWORD
      - CH_APISIX_PASSWORD
      - CH_MIGRATOR_PASSWORD
      - CLICKHOUSE_DO_NOT_CHOWN=1
    restart: unless-stopped
    networks:
      gw-ch: {}

  # One-shot schema migration runner (golang-migrate, ClickHouse-KB-recommended).
  # Pinned image; restart:no so it exits after applying migrations.
  # Invoked by res/ansible/dev.yml AFTER init.sql (healthcheck-gated) and by
  # `make ch-migrate` / `make ch-migrate-status`. Uses the ClickHouse NATIVE
  # protocol (port 9000, not HTTP 8123) - golang-migrate's `clickhouse://`
  # scheme maps to the native protocol. Connects via compose DNS
  # (clickhouse:9000), NOT localhost - no --network host needed.
  # x-migrations-table-engine=MergeTree so schema_migrations survives
  # clickhouse-backup (default TinyLog is not backed up). DSN credentials:
  # least-privilege migrator user (see clickhouse-provision.sh).
  migrate:
    profiles: [migration]
    image: migrate/migrate@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    container_name: gw-migrate
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ../../conf/sql/migrations:/migrations:ro
    # entrypoint holds the persistent flags so `podman-compose run --rm
    # migrate <subcommand>` replaces ONLY args (subcommand), preserving
    # -path and -database. Default command is "up"; overridden by
    # `run ... migrate version` for status, etc.
    entrypoint:
      - "migrate"
      - "-path=/migrations/"
      - "-database=clickhouse://clickhouse:9000?username=migrator&password=${CH_MIGRATOR_PASSWORD}&database=llm_gateway&x-multi-statement=true&x-migrations-table-engine=MergeTree"
    command: ["up"]
    restart: "no"
    networks:
      gw-ch: {}

  vector:
    image: timberio/vector@sha256:1163571c8b59ab6755c1b5488bb2f129151c3b72130ad0500b10420fcc504d9d
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ../../conf/vector.toml:/etc/vector/vector.toml:ro
    env_file:
      - ../../.env
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      gw-ch: {}
      gw-ingest: {}

  openbao:
    build:
      context: ../..
      dockerfile: res/docker/Dockerfile.openbao
    container_name: gw-openbao
    volumes:
      - ../../conf/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/data
    env_file:
      - ../../.env
    environment:
      BAO_LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/v1/sys/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      gw-secrets: {}

  prometheus:
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: gw-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ../../conf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      gw-metrics: {}

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: gw-grafana
    env_file:
      - ../../.env
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource,marcusolsson-dynamictext-panel
      # Prod posture by default: anonymous OFF, auth-proxy via the external
      # wiki nginx pinned on gw-edge (10.99.60.2). The proxy header is only
      # honored from the edge CIDR.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: "${GRAFANA_EDGE_CIDR:-10.99.60.2/32, 127.0.0.1/32}"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3030/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../../conf/grafana/rendered/provisioning:/etc/grafana/provisioning:ro
      - ../../conf/grafana/rendered/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3030:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      gw-ch: {}
      gw-metrics: {}
      gw-edge:
        # Static address: the external edge proxy pins to .2 and proxies here.
        ipv4_address: 10.99.60.3

  etcd:
    image: quay.io/coreos/etcd@sha256:fb5f961035e5263b31fe103e57b645fa23e612c9d58118a8548eb160fedecb55
    container_name: gw-etcd
    entrypoint: /usr/local/bin/etcd
    command:
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    env_file:
      - ../../.env
    healthcheck:
      # Authenticated once `make etcd-auth-init` has enabled RBAC; the
      # --user flag is ignored by an auth-disabled cluster, so this also
      # works before bootstrap.
      test: ["CMD-SHELL", "etcdctl --user root:\"$$ETCD_ROOT_PASSWORD\" endpoint health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    networks:
      gw-etcd: {}

volumes:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  openbao-data:
  etcd-data:

# Security segmentation (REQ-SECURITY-HARDENING FR-6): static subnets so
# user/grant HOST restrictions and the Grafana auth-proxy whitelist bind to
# stable addresses. One network per trust boundary; apisix is the only
# service attached to more than the boundary it needs to serve traffic.
networks:
  gw-ch:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.10.0/24
          gateway: 10.99.10.1
          # DHCP pool kept clear of the static apisix address (.2).
          ip_range: 10.99.10.64/26
  gw-etcd:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.20.0/24
          gateway: 10.99.20.1
  gw-secrets:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.30.0/24
          gateway: 10.99.30.1
  gw-metrics:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.40.0/24
          gateway: 10.99.40.1
  gw-ingest:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.50.0/24
          gateway: 10.99.50.1
  # Edge-proxy boundary: the external wiki nginx is the only non-gateway
  # member, pinned to 10.99.60.2 (the Grafana auth-proxy whitelist trusts
  # exactly that address). See RUNBOOK-EDGE-PROXY.
  gw-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.60.0/24
          gateway: 10.99.60.1
          # DHCP pool kept clear of the pinned edge-proxy address (.2).
          ip_range: 10.99.60.64/26
  dataops:
    external: true
    name: dataops_default
