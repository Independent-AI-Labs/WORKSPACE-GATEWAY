      pass_host: node
      nodes:
        "chatgpt.com:443": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/openai/(.*)", "/backend-api/codex/responses"]
      provider-oauth:
        auth_base: /openai/auth
        protocol: chatgpt_device
        oauth_host: "https://auth.openai.com"
        client_id: "app_EMoamEEZ73f0CkXaXp7hrann"
        user_agent: "opencode/1.18.3"
        device_authorize_path: /api/accounts/deviceauth/usercode
        device_poll_path: /api/accounts/deviceauth/token
        device_callback_path: /deviceauth/callback
        verification_path: /codex/device
        token_path: /oauth/token
        authorize_path: /oauth/authorize
        authorize_params:
          scope: "openid profile email offline_access"
          id_token_add_organizations: "true"
          codex_cli_simplified_flow: "true"
          originator: "opencode"
        browser_flow: true
        token_prefix: "secret/data/gateway/openai-tokens/"
        device_prefix: "secret/data/gateway/openai-device/"
        refresh_rotation_required: false
        strip_request_fields:
          - max_output_tokens
        fixed_upstream_headers:
          originator: "opencode"
        alias_headers:
          X-OpenCode-Session-Id: "session-id"
        account_claim_paths:
          - claim: chatgpt_account_id
          - claim: "https://api.openai.com/auth"
            field: chatgpt_account_id
          - claim: organizations
            index: 1
            field: id
        account_header: ChatGPT-Account-Id
      key-meta: {}
      limit-count:
        count: 100
        time_window: 60
        rejected_code: 429
        key_type: var
        key: http_x_gateway_key_id
        policy: local
      prometheus:
        prefer_name: true
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      http-logger:
        uri: "http://vector:8080/ingest"
        method: POST
        content_type: "application/json"
        batch_max_size: 1
        include_req_body: true
        include_resp_body: true
        max_req_body_bytes: 262144
        max_resp_body_bytes: 1048576
      proxy-buffering:
        disable: true
      redact:
        patterns_file: "/etc/apisix/redact-patterns.json"
      sse-usage:
        clickhouse_addr: "http://clickhouse:8123"
        clickhouse_user: "apisix_rw"
        clickhouse_password_env: "CH_APISIX_PASSWORD"

