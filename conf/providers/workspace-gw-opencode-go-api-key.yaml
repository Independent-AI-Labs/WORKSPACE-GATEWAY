---
id: workspace-gw-opencode-go-api-key
name: "Workspace GW (OpenCode Go API Key)"
provider:
  id: opencode-go
  label: OpenCode Go
route: "/opencode/v1"
npm: "@ai-sdk/openai-compatible"
auth:
  type: api_key
options:
  headers:
    X-Tenant-ID: default
    X-User-ID: agent
model_source:
  type: gateway
  endpoint: "/opencode_federated/v1/models"
  api_key: "vgw-gateway-key"
  filter:
    exclude:
      - "-free$"
pricing:
  source:
    type: models_dev
    provider: opencode
  missing_policy: unknown
