---
id: workspace-gw-kimi-api-key
name: "Workspace GW (Kimi API Key)"
provider:
  id: kimi
  label: Kimi
route: "/kimi-key"
npm: "@ai-sdk/openai-compatible"
auth:
  type: api_key
options:
  headers:
    X-Tenant-ID: default
    X-User-ID: agent
model_source:
  type: models_dev_provider
  provider: moonshotai
  normalize:
    strip_prefix: "moonshotai/"
    lowercase: true
model_aliases:
  kimi-for-coding: kimi-k2.7-code
  kimi-for-coding-highspeed: kimi-k2.7-code-highspeed
  k3: kimi-k3
pricing:
  source:
    type: models_dev
    provider: moonshotai
  missing_policy: unknown
