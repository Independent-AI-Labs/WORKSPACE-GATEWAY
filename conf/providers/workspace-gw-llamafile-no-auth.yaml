---
id: workspace-gw-llamafile-no-auth
name: "Workspace GW (llamafile No Auth)"
# local: models served from non-vendor infra (local network, e.g. llamafile
# on a LAN host). Synced into llm_gateway.model_registry by
# res/scripts/sync-model-registry.sh; Grafana's include_local toggle reads it.
local: true
provider:
  id: llamafile
  label: llamafile
route: "/llamafile/v1"
npm: "@ai-sdk/openai-compatible"
auth:
  type: none
options:
  headers:
    X-Tenant-ID: default
    X-User-ID: agent
context_limit_ceiling: 256000
model_source:
  type: llamafile
  endpoint: "/llamafile/v1/models"
  model_metadata:
    - id: "/zip/MiniCPM5-1B-Q8_0.gguf"
      name: "MiniCPM5"
      limit:
        context: 131072
        output: 131072
      tool_call: true
      reasoning: false
pricing:
  source:
    type: unknown
  missing_policy: unknown
