---
id: workspace-gw-kimi-device-oauth
name: "Workspace GW (Kimi Device OAuth)"
provider:
  id: kimi
  label: Kimi
route: "/kimi"
npm: "@ai-sdk/openai-compatible"
auth:
  type: oauth
  plugin: oauth-auth
  methods:
    - id: kimi-device-oauth
      flow: device_authorization
      route: /kimi/auth
options:
  headers:
    X-Tenant-ID: default
    X-User-ID: agent
model_source:
  type: models_dev_provider
  provider: moonshotai
  normalize:
    strip_prefix: "moonshotai/"
    lowercase: true
model_aliases:
  kimi-for-coding: kimi-k2.7-code
  kimi-for-coding-highspeed: kimi-k2.7-code-highspeed
  k3: kimi-k3
pricing:
  source:
    type: models_dev
    provider: moonshotai
  missing_policy: unknown
